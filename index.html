<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Face Tracker</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;

            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            margin: 20px;
        }

        #camera {
            position: relative;

            width: 95vw;
            max-width: 600px;

            overflow: hidden;
            border-radius: 12px;

            background: black;
        }

        video {
            width: 100%;
            display: block;

            transform: scaleX(-1);
        }

        canvas {
            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            pointer-events: none;

            transform: scaleX(-1);
        }

        button {
            margin-top: 20px;

            padding: 12px 20px;

            border: none;
            border-radius: 8px;

            background: #00cc66;
            color: white;

            font-size: 16px;
        }

        #status {
            margin-top: 15px;

            color: #aaa;

            text-align: center;
        }

    </style>

</head>


<body>


    <h1>Face Tracker</h1>


    <div id="camera">

        <video
            id="video"
            autoplay
            playsinline
            muted>
        </video>

        <canvas id="canvas"></canvas>

    </div>


    <button id="start">
        Iniciar câmera
    </button>


    <div id="status">
        Câmera desligada
    </div>



    <script type="module">

        import {
            FaceLandmarker,
            FilesetResolver
        }

        from
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22";



        const video =
            document.getElementById("video");

        const canvas =
            document.getElementById("canvas");

        const ctx =
            canvas.getContext("2d");

        const button =
            document.getElementById("start");

        const status =
            document.getElementById("status");



        let detector = null;

        let cameraLigada = false;

        let pontosAtuais = null;



        /*
        ========================================
        INICIAR MEDIAPIPE
        ========================================
        */

        async function iniciarDetector() {

            try {

                status.textContent =
                    "Carregando detector...";


                const vision =
                    await FilesetResolver.forVisionTasks(

                        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"

                    );


                detector =
                    await FaceLandmarker.createFromOptions(

                        vision,

                        {

                            baseOptions: {

                                modelAssetPath:

                                    "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",

                                delegate: "GPU"

                            },

                            runningMode: "VIDEO",

                            numFaces: 1

                        }

                    );


                status.textContent =
                    "Detector carregado!";


                iniciarCamera();

            }

            catch (erro) {

                console.error(erro);

                status.textContent =
                    "Erro ao carregar o detector.";

            }

        }



        /*
        ========================================
        INICIAR CÂMERA
        ========================================
        */

        async function iniciarCamera() {

            try {

                if (!navigator.mediaDevices) {

                    throw new Error(
                        "Câmera não disponível."
                    );

                }


                const stream =

                    await navigator
                        .mediaDevices
                        .getUserMedia({

                            video: {

                                facingMode: "user",

                                width: {
                                    ideal: 640
                                },

                                height: {
                                    ideal: 480
                                }

                            },

                            audio: false

                        });


                video.srcObject = stream;

                cameraLigada = true;


                status.textContent =
                    "Câmera funcionando!";


                video.onloadeddata =
                    function () {

                        canvas.width =
                            video.videoWidth;

                        canvas.height =
                            video.videoHeight;

                        rastrear();

                    };

            }

            catch (erro) {

                console.error(
                    "Erro da câmera:",
                    erro
                );


                status.textContent =
                    "Não foi possível acessar a câmera.";

            }

        }



        /*
        ========================================
        RASTREAMENTO
        ========================================
        */

        function rastrear() {

            if (
                detector === null ||
                video.readyState < 2
            ) {

                requestAnimationFrame(
                    rastrear
                );

                return;

            }


            const tempo =
                performance.now();


            const resultado =
                detector.detectForVideo(

                    video,

                    tempo

                );


            ctx.clearRect(

                0,
                0,

                canvas.width,
                canvas.height

            );


            if (

                resultado.faceLandmarks &&
                resultado.faceLandmarks.length > 0

            ) {

                pontosAtuais =
                    resultado.faceLandmarks[0];


                desenharRosto();


                status.textContent =
                    "Rosto detectado!";

            }

            else {

                pontosAtuais = null;


                status.textContent =
                    "Procurando rosto...";

            }


            requestAnimationFrame(
                rastrear
            );

        }



        /*
        ========================================
        DESENHAR ROSTO
        ========================================
        */

        function desenharRosto() {

            if (
                pontosAtuais === null
            ) {

                return;

            }


            let minX = 1;

            let maxX = 0;

            let minY = 1;

            let maxY = 0;



            /*
            ====================================
            ENCONTRAR LIMITES DO ROSTO
            ====================================
            */

            for (
                const ponto
                of pontosAtuais
            ) {

                if (
                    ponto.x < minX
                ) {

                    minX = ponto.x;

                }


                if (
                    ponto.x > maxX
                ) {

                    maxX = ponto.x;

                }


                if (
                    ponto.y < minY
                ) {

                    minY = ponto.y;

                }


                if (
                    ponto.y > maxY
                ) {

                    maxY = ponto.y;

                }

            }



            /*
            ====================================
            CONVERTER PARA PIXELS
            ====================================
            */

            const x =
                minX *
                canvas.width;


            const y =
                minY *
                canvas.height;


            const largura =
                (maxX - minX) *
                canvas.width;


            const altura =
                (maxY - minY) *
                canvas.height;



            /*
            ====================================
            QUADRADO VERDE
            ====================================
            */

            ctx.strokeStyle =
                "#00ff66";

            ctx.lineWidth = 4;


            ctx.strokeRect(

                x,
                y,

                largura,
                altura

            );



            /*
            ====================================
            PONTOS VERMELHOS
            ====================================
            */

            ctx.fillStyle =
                "#ff3333";


            for (
                const ponto
                of pontosAtuais
            ) {

                const px =
                    ponto.x *
                    canvas.width;


                const py =
                    ponto.y *
                    canvas.height;


                ctx.beginPath();


                ctx.arc(

                    px,
                    py,

                    2,

                    0,
                    Math.PI * 2

                );


                ctx.fill();

            }

        }



        /*
        ========================================
        BOTÃO
        ========================================
        */

        button.addEventListener(

            "click",

            function () {

                if (
                    cameraLigada === false
                ) {

                    iniciarDetector();

                }

            }

        );

    </script>


</body>

</html>
