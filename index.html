<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FaceTrack - Hand Tracker</title>

    <link
        rel="stylesheet"
        href="css/hand.css"
    >

</head>


<body>

    <h1>🖐️ Hand Tracker</h1>


    <div id="camera">

        <video
            id="video"
            autoplay
            playsinline
            muted>
        </video>

        <canvas id="canvas"></canvas>

    </div>


    <button id="start">
        Abrir câmera
    </button>


    <p id="status">
        Câmera desligada
    </p>


    <script
        type="module"
        src="js/hand.js">
    </script>

</body>

</html>
