<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Teste de Câmera</title>

    <style>

        body {
            margin: 0;
            background: #111;
            color: white;

            font-family: Arial, sans-serif;

            text-align: center;
        }

        h1 {
            margin-top: 20px;
        }

        #camera {
            width: 95vw;
            max-width: 600px;

            margin: auto;

            background: black;

            border-radius: 10px;

            overflow: hidden;
        }

        video {
            width: 100%;
            display: block;
        }

        button {
            margin-top: 20px;

            padding: 12px 20px;

            border: none;

            border-radius: 8px;

            background: #00cc66;

            color: white;

            font-size: 16px;
        }

        #status {
            margin-top: 15px;

            color: #aaa;
        }

    </style>

</head>


<body>

    <h1>Teste de Câmera</h1>


    <div id="camera">

        <video
            id="video"
            autoplay
            playsinline
            muted>
        </video>

    </div>


    <button id="start">
        Abrir câmera
    </button>


    <div id="status">
        Câmera desligada
    </div>



    <script>

        const video =
            document.getElementById("video");

        const button =
            document.getElementById("start");

        const status =
            document.getElementById("status");


        button.addEventListener(
            "click",
            iniciarCamera
        );


        async function iniciarCamera() {

            try {

                status.textContent =
                    "Solicitando câmera...";


                const stream =
                    await navigator.mediaDevices.getUserMedia({

                        video: {
                            facingMode: "user"
                        },

                        audio: false

                    });


                video.srcObject =
                    stream;


                status.textContent =
                    "CÂMERA FUNCIONANDO!";

            }


            catch (erro) {

                console.error(erro);


                status.textContent =
                    "ERRO: " + erro.name;

            }

        }

    </script>


</body>

</html>
